name: Android CI

on:
  push:
    branches: [main, "releases/**"]
  pull_request:
    branches: [main, "releases/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble release (vendored Core 0.1.0)
        run: ./gradlew --no-daemon :ni_sdk:assembleRelease :sample:assembleDebug
